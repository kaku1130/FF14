<title>FFXIV 全職業熱鍵排列參考</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f2e8;
  --surface:#ffffff;
  --surface-alt:#efe7d5;
  --ink:#2a2318;
  --ink-dim:#71695a;
  --ink-faint:#a49a86;
  --border:#ddd0b2;
  --accent:#166a72;
  --accent-ink:#f4faf8;
  --gold:#9c7423;
  --cell-bg:#fffdf8;
  --cell-border:#d8caa8;
  --type-ws:#1f5f9e;
  --type-ability:#2f7d3d;
  --type-magic:#7d3f9e;
  --gen-tag:#71695a;
  --tip-bg:#2a2318;
  --tip-ink:#f4efe0;
  --tip-border:#4a4130;
  --role-tank:#2f5f96;
  --role-healer:#3f7a4d;
  --role-melee:#a84a2c;
  --role-rphys:#93701f;
  --role-rmagic:#6d4a99;
  --shadow: 0 1px 2px rgba(40,30,10,.06), 0 8px 24px rgba(40,30,10,.06);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#181410;
    --surface:#211b14;
    --surface-alt:#2a2318;
    --ink:#ece3d2;
    --ink-dim:#b3a691;
    --ink-faint:#7d7261;
    --border:#3c3323;
    --accent:#4fb3ba;
    --accent-ink:#0e1a1a;
    --gold:#d9ab52;
    --cell-bg:#241e15;
    --cell-border:#453b28;
    --gen-tag:#8f8570;
    --tip-bg:#0e1a1a;
    --tip-ink:#eef6f4;
    --tip-border:#2c4c4e;
    --role-tank:#6ea3dd;
    --role-healer:#7dc08d;
    --role-melee:#e08659;
    --role-rphys:#d3b25a;
    --role-rmagic:#b494e0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#181410;
  --surface:#211b14;
  --surface-alt:#2a2318;
  --ink:#ece3d2;
  --ink-dim:#b3a691;
  --ink-faint:#7d7261;
  --border:#3c3323;
  --accent:#4fb3ba;
  --accent-ink:#0e1a1a;
  --gold:#d9ab52;
  --cell-bg:#241e15;
  --cell-border:#453b28;
  --gen-tag:#8f8570;
  --tip-bg:#0e1a1a;
  --tip-ink:#eef6f4;
  --tip-border:#2c4c4e;
  --role-tank:#6ea3dd;
  --role-healer:#7dc08d;
  --role-melee:#e08659;
  --role-rphys:#d3b25a;
  --role-rmagic:#b494e0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","Noto Sans",system-ui,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}

.layout{
  display:grid;
  grid-template-columns: 20% 80%;
  min-height:100vh;
}
@media (max-width:880px){
  .layout{grid-template-columns:1fr;}
}

.sidebar{
  border-right:1px solid var(--border);
  padding:28px 16px 40px;
  position:sticky;
  top:0;
  align-self:start;
  height:100vh;
  overflow-y:auto;
  background:var(--surface);
}
@media (max-width:880px){
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);}
}
.brand{
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:14px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--gold);
  margin:0 0 2px;
}
.brand-sub{
  font-family:"Noto Serif TC",serif;
  font-size:19px;
  font-weight:700;
  margin:0 0 20px;
}
.nav-group{margin-bottom:4px;}
.nav-group-title{
  display:flex;align-items:center;gap:8px;
  font-size:12px;
  font-weight:600;
  letter-spacing:.06em;
  padding:8px 8px;
  color:var(--ink-dim);
}
.nav-group-title .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.nav-jobs{
  display:flex;flex-direction:column;gap:1px;
  margin:2px 0 12px 22px;
  border-left:1px solid var(--border);
  padding-left:10px;
}
.nav-job{
  display:block;
  text-decoration:none;
  font-size:13.5px;
  color:var(--ink-dim);
  padding:5px 6px;
  border-radius:6px;
  cursor:pointer;
  white-space:nowrap;
  background:none;
  border:none;
  text-align:left;
  width:100%;
  font-family:inherit;
}
.nav-job:hover{color:var(--ink);background:var(--surface-alt);}
.nav-job.active{color:var(--accent);font-weight:600;background:var(--surface-alt);}

.main-content{padding:36px 32px 64px;max-width:none;}
header.page{margin-bottom:24px;}
.eyebrow{
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--gold);
  margin:0 0 6px;
}
h1{
  font-family:"Noto Serif TC",serif;
  font-size:26px;
  font-weight:700;
  margin:0 0 14px;
}

.legend{
  display:flex;flex-wrap:wrap;gap:10px 20px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow);
  font-size:12.5px;
  color:var(--ink-dim);
  align-items:center;
}
.legend b{color:var(--ink);font-weight:600;}
.swatch{display:inline-flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;border-radius:3px;flex:none;}
.dot.type-ws{background:var(--type-ws);}
.dot.type-ability{background:var(--type-ability);}
.dot.type-magic{background:var(--type-magic);}
.dot.type-gen{background:var(--gen-tag);}

.page-block{margin-top:32px;}
.page-title{
  display:flex;align-items:baseline;gap:10px;
  font-family:"Noto Serif TC",serif;
  font-size:17px;
  font-weight:700;
  margin:0 0 16px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}
.page-title .idx{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);
  font-size:12px;font-weight:700;font-family:"Noto Sans TC",sans-serif;
}

.groups{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:28px 22px;
}

.pad{
  display:grid;
  grid-template-columns: repeat(3, 62px);
  grid-template-rows: repeat(3, 62px);
  gap:6px;
  flex:none;
}
@media (max-width:560px){
  .pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);}
}

.cell{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:var(--cell-bg);
  border:1px solid var(--cell-border);
  border-radius:9px;
  padding:4px;
  cursor:default;
  transition:border-color .12s, transform .12s;
}
.cell.pos-top{grid-column:2;grid-row:1;}
.cell.pos-left{grid-column:1;grid-row:2;}
.cell.pos-right{grid-column:3;grid-row:2;}
.cell.pos-bottom{grid-column:2;grid-row:3;}
.cell.empty{
  background:repeating-linear-gradient(45deg, var(--surface-alt), var(--surface-alt) 6px, transparent 6px, transparent 12px);
  border:2px dashed var(--ink-faint);
  opacity:1;
}
.cell.empty::after{
  content:"×";
  font-size:20px;
  font-weight:700;
  color:var(--ink-faint);
}

.cell:not(.empty):hover{
  border-color:var(--accent);
  transform:translateY(-1px);
  z-index:5;
}

.cell-icon{
  width:44px;
  height:44px;
  border-radius:6px;
  object-fit:cover;
  position:relative;
  display:block;
}
@media (max-width:560px){
  .cell-icon{width:36px;height:36px;}
}
.cell-fallback{
  font-size:11.5px;
  font-weight:600;
  line-height:1.25;
  color:var(--ink);
  word-break:break-word;
  position:relative;
  padding:2px;
}
.cat-bar{
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  border-radius:9px 9px 0 0;
  z-index:1;
}
.cat-bar.type-ws{background:var(--type-ws);}
.cat-bar.type-ability{background:var(--type-ability);}
.cat-bar.type-magic{background:var(--type-magic);}
.cat-bar.type-gen{background:var(--gen-tag);}

.tooltip{
  display:none;
  position:absolute;
  top:110%;
  left:50%;
  transform:translateX(-50%);
  width:280px;
  background:var(--tip-bg);
  color:var(--tip-ink);
  border:1px solid var(--tip-border);
  border-radius:8px;
  padding:10px 12px;
  font-size:12.5px;
  font-weight:400;
  line-height:1.6;
  text-align:left;
  white-space:pre-line;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  z-index:20;
  pointer-events:none;
}
.tooltip .tip-name{
  font-weight:700;
  font-size:13px;
  margin-bottom:4px;
  display:block;
  color:#fff;
}
.tooltip .tip-en{
  font-weight:400;
  font-size:11px;
  color:var(--ink-faint);
  margin-left:6px;
}
.cell:not(.empty):hover .tooltip{display:block;}

.pad:nth-child(4) .tooltip{left:auto;right:0;transform:none;}
.pad:nth-child(1) .tooltip{left:0;transform:none;}
</style>

<div class="layout">
  <nav class="sidebar">
    <p class="brand">FINAL FANTASY XIV</p>
    <p class="brand-sub">全職業熱鍵排列參考</p>
    <div id="navRoot"></div>
  </nav>
  <main class="main-content">
    <header class="page">
      <p class="eyebrow" id="roleLabel">防護職業</p>
      <h1 id="jobTitle">騎士</h1>
      <div class="legend">
        <span class="swatch"><span class="dot type-ws"></span><b>戰技</b></span>
        <span class="swatch"><span class="dot type-ability"></span><b>能力</b></span>
        <span class="swatch"><span class="dot type-magic"></span><b>魔法</b></span>
        <span class="swatch"><span class="dot type-gen"></span><b>通用指令</b></span>
      </div>
    </header>
    <div id="app"></div>
  </main>
</div>

<script>
const ROLE_META = {
  tank:   { zh:"防護職業", color:"var(--role-tank)" },
  healer: { zh:"治療職業", color:"var(--role-healer)" },
  melee:  { zh:"近戰職業", color:"var(--role-melee)" },
  rphys:  { zh:"遠程物理職業", color:"var(--role-rphys)" },
  rmagic: { zh:"遠程魔法職業", color:"var(--role-rmagic)" }
};
const GROUP_ORDER = ["tank","healer","melee","rphys","rmagic"];
const ICON_BASE = "https://www.ffxiv.com.tw/web/intro/guide/battle/";

const TYPE_CLASS = {
  "戰技":"type-ws",
  "能力":"type-ability",
  "魔法":"type-magic",
  "角色能力":"type-ability",
  "通用指令":"type-gen"
};

const POS = ["bottom","left","top","right"];

function iconUrl(slug, num) {
  if (!num) return "";
  return ICON_BASE + slug + "/images/icon/" + String(num).padStart(2,"0") + ".png";
}

function buildCell(job, name) {
  if (!name) return '<div class="cell empty"></div>';
  const d = job.skills[name];
  if (!d) return '<div class="cell empty"></div>';
  const typeClass = TYPE_CLASS[d.type] || "type-gen";
  const tooltipText = (d.tooltip && d.tooltip.length) ? d.tooltip : "（完整效果請參考遊戲內技能說明）";
  const tooltip = tooltipText.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const icon = iconUrl(job.slug, d.iconNum);
  const visual = icon
    ? '<img class="cell-icon" src="' + icon + '" alt="' + d.zh + '">'
    : '<span class="cell-fallback">' + d.zh + '</span>';
  return (
    '<div class="cell">' +
      '<span class="cat-bar ' + typeClass + '"></span>' +
      visual +
      '<div class="tooltip">' +
        '<span class="tip-name">' + d.zh + '<span class="tip-en">' + name + '</span></span>' +
        '<span class="tip-type">【' + d.type + '】</span>\n' +
        tooltip +
      '</div>' +
    '</div>'
  );
}

function buildPad(job, cells) {
  let html = '<div class="pad">';
  for (let i = 0; i < 4; i++) {
    const pos = POS[i];
    let cellHtml = buildCell(job, cells[i]);
    cellHtml = cellHtml.replace('class="cell', 'class="cell pos-' + pos)
                        .replace('cell pos-' + pos + ' empty', 'cell empty pos-' + pos);
    html += cellHtml;
  }
  html += '</div>';
  return html;
}

function buildRow(job, rowCells, rowIndex) {
  let groupsHtml = '';
  for (let g = 0; g < 4; g++) {
    groupsHtml += buildPad(job, rowCells.slice(g*4, g*4+4));
  }
  return (
    '<section class="page-block">' +
      '<h2 class="page-title"><span class="idx">' + (rowIndex+1) + '</span>熱鍵列 ' + (rowIndex+1) + '</h2>' +
      '<div class="groups">' + groupsHtml + '</div>' +
    '</section>'
  );
}

function renderJob(slug) {
  const job = JOBS_DATA[slug];
  if (!job) return;
  document.getElementById('roleLabel').textContent = ROLE_META[job.role].zh;
  document.getElementById('jobTitle').textContent = job.zh;
  document.getElementById('app').innerHTML = job.rows.map((r,i) => buildRow(job, r, i)).join('');
  document.querySelectorAll('.nav-job').forEach(el => {
    el.classList.toggle('active', el.dataset.slug === slug);
  });
  try { localStorage.setItem('ffxiv-hotbar-job', slug); } catch(e) {}
}

function buildSidebar() {
  const root = document.getElementById('navRoot');
  let html = '';
  GROUP_ORDER.forEach(roleKey => {
    const jobs = Object.keys(JOBS_DATA).filter(s => JOBS_DATA[s].role === roleKey);
    if (!jobs.length) return;
    const meta = ROLE_META[roleKey];
    html += '<div class="nav-group">';
    html += '<div class="nav-group-title"><span class="dot" style="background:' + meta.color + '"></span>' + meta.zh + '</div>';
    html += '<div class="nav-jobs">';
    jobs.forEach(slug => {
      html += '<button type="button" class="nav-job" data-slug="' + slug + '">' + JOBS_DATA[slug].zh + '</button>';
    });
    html += '</div></div>';
  });
  root.innerHTML = html;
  root.querySelectorAll('.nav-job').forEach(el => {
    el.addEventListener('click', () => renderJob(el.dataset.slug));
  });
}
